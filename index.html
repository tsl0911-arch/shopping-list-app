<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #8a90a0;
    --line: #e6e8ee;
    --accent: #3b82f6;
    --accent-text: #ffffff;
    --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b;
      --card: #1e2128;
      --text: #e8eaf0;
      --muted: #8b91a1;
      --line: #2c303a;
      --accent: #5b9bff;
      --accent-text: #0d1117;
      --danger: #ff6b70;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 480px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .summary { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-size: 16px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    font: inherit;
    cursor: pointer;
  }
  .add {
    padding: 0 18px;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 10px;
  }
  .add:hover { filter: brightness(1.08); }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: 0; }
  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  li .label {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  li.done .label { color: var(--muted); text-decoration: line-through; }
  .del {
    width: 30px;
    height: 30px;
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 8px;
  }
  .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  .empty { padding: 32px 14px; text-align: center; color: var(--muted); }

  .footer { display: flex; justify-content: flex-end; margin-top: 12px; }
  .clear {
    padding: 6px 10px;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 8px;
  }
  .clear:hover { color: var(--danger); }
  .clear[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>🛒 쇼핑 리스트</h1>
  <p class="summary" id="summary"></p>

  <form id="form">
    <input type="text" id="input" placeholder="사야 할 물건을 입력하세요" autocomplete="off" autofocus>
    <button type="submit" class="add">추가</button>
  </form>

  <ul id="list"></ul>

  <div class="footer">
    <button type="button" class="clear" id="clear" hidden>체크한 항목 모두 삭제</button>
  </div>
</main>

<script>
  const STORAGE_KEY = "shopping-list-items";

  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const list = document.getElementById("list");
  const summary = document.getElementById("summary");
  const clearBtn = document.getElementById("clear");

  let items = load();

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(saved) ? saved : [];
    } catch {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch {}
  }

  function addItem(text) {
    items.push({ id: Date.now() + Math.random(), text, done: false });
    save();
    render();
  }

  function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (item) item.done = !item.done;
    save();
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  function render() {
    list.replaceChildren();

    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "리스트가 비어 있어요. 첫 항목을 추가해 보세요!";
      list.append(empty);
    }

    for (const item of items) {
      const li = document.createElement("li");
      if (item.done) li.classList.add("done");

      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = item.done;
      check.id = "item-" + item.id;
      check.addEventListener("change", () => toggleItem(item.id));

      const label = document.createElement("label");
      label.className = "label";
      label.htmlFor = check.id;
      label.textContent = item.text;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.title = "삭제";
      del.setAttribute("aria-label", item.text + " 삭제");
      del.textContent = "✕";
      del.addEventListener("click", () => deleteItem(item.id));

      li.append(check, label, del);
      list.append(li);
    }

    const doneCount = items.filter(i => i.done).length;
    summary.textContent = items.length
      ? `총 ${items.length}개 중 ${doneCount}개 완료`
      : "";
    clearBtn.hidden = doneCount === 0;
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addItem(text);
    input.value = "";
    input.focus();
  });

  clearBtn.addEventListener("click", () => {
    items = items.filter(i => !i.done);
    save();
    render();
  });

  render();
</script>
</body>
</html>
