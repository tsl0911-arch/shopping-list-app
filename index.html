<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #8a90a0;
    --line: #e6e8ee;
    --accent: #3b82f6;
    --accent-text: #ffffff;
    --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b;
      --card: #1e2128;
      --text: #e8eaf0;
      --muted: #8b91a1;
      --line: #2c303a;
      --accent: #5b9bff;
      --accent-text: #0d1117;
      --danger: #ff6b70;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 480px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .summary { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .error {
    margin: 0 0 16px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--danger);
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    border-radius: 10px;
  }
  .error[hidden] { display: none; }

  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-size: 16px;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    font: inherit;
    cursor: pointer;
  }
  .add {
    padding: 0 18px;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 10px;
  }
  .add:hover { filter: brightness(1.08); }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: 0; }
  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  li .label {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  li.done .label { color: var(--muted); text-decoration: line-through; }
  .del {
    width: 30px;
    height: 30px;
    font-size: 18px;
    line-height: 1;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 8px;
  }
  .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  .empty { padding: 32px 14px; text-align: center; color: var(--muted); }

  .footer { display: flex; justify-content: flex-end; margin-top: 12px; }
  .clear {
    padding: 6px 10px;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 8px;
  }
  .clear:hover { color: var(--danger); }
  .clear[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>🛒 쇼핑 리스트</h1>
  <p class="summary" id="summary"></p>
  <p class="error" id="error" role="alert" hidden></p>

  <form id="form">
    <input type="text" id="input" placeholder="사야 할 물건을 입력하세요" autocomplete="off" autofocus>
    <button type="submit" class="add">추가</button>
  </form>

  <ul id="list"></ul>

  <div class="footer">
    <button type="button" class="clear" id="clear" hidden>체크한 항목 모두 삭제</button>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://udsawdzzpqtwxxycaxwf.supabase.co";
  // 공개용(publishable) 키라서 브라우저에 노출되어도 된다. 접근 범위는 RLS 정책이 제한한다.
  const SUPABASE_KEY = "sb_publishable_RAyuZdwduGCGBnp_Xiarww_6t_nvzR0";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const list = document.getElementById("list");
  const summary = document.getElementById("summary");
  const clearBtn = document.getElementById("clear");
  const errorBox = document.getElementById("error");

  let items = [];
  let loading = true;

  function showError(message) {
    errorBox.textContent = message;
    errorBox.hidden = !message;
  }

  // 실패하면 에러를 표시하고 false를 돌려준다.
  function check(error, message) {
    if (!error) return true;
    console.error(error);
    showError(message);
    return false;
  }

  async function load() {
    const { data, error } = await db
      .from("shopping_items")
      .select("id, text, done")
      .order("created_at")
      .order("id");
    loading = false;
    if (check(error, "목록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.")) {
      showError("");
      items = data;
    }
    render();
  }

  // localStorage 시절의 항목을 Supabase로 한 번 옮긴다. 모든 사용자가 옮긴 뒤에는 지워도 된다.
  const LEGACY_KEY = "shopping-list-items";

  // 옮길 게 없거나 옮기기에 성공하면 true. 실패하면 원본을 남겨 두고 false.
  async function importLegacy() {
    let legacy;
    try {
      legacy = JSON.parse(localStorage.getItem(LEGACY_KEY));
    } catch {
      return true;
    }
    if (!Array.isArray(legacy)) return true;

    const rows = legacy
      .filter(i => i && typeof i.text === "string" && i.text.trim())
      .map(i => ({ text: i.text.trim(), done: !!i.done }));
    if (rows.length) {
      const { error } = await db.from("shopping_items").insert(rows);
      if (error) {
        console.error(error);
        return false;
      }
    }
    try {
      localStorage.removeItem(LEGACY_KEY);
    } catch {}
    return true;
  }

  async function addItem(text) {
    const { data, error } = await db
      .from("shopping_items")
      .insert({ text })
      .select("id, text, done")
      .single();
    if (!check(error, "항목을 추가하지 못했어요.")) return false;
    showError("");
    items.push(data);
    render();
    return true;
  }

  async function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    const { error } = await db
      .from("shopping_items")
      .update({ done: !item.done })
      .eq("id", id);
    if (check(error, "상태를 변경하지 못했어요.")) {
      showError("");
      item.done = !item.done;
    }
    render();
  }

  async function deleteItem(id) {
    const { error } = await db.from("shopping_items").delete().eq("id", id);
    if (check(error, "항목을 삭제하지 못했어요.")) {
      showError("");
      items = items.filter(i => i.id !== id);
    }
    render();
  }

  async function clearDone() {
    const { error } = await db.from("shopping_items").delete().eq("done", true);
    if (check(error, "체크한 항목을 삭제하지 못했어요.")) {
      showError("");
      items = items.filter(i => !i.done);
    }
    render();
  }

  function render() {
    list.replaceChildren();

    if (loading) {
      const msg = document.createElement("li");
      msg.className = "empty";
      msg.textContent = "불러오는 중…";
      list.append(msg);
      summary.textContent = "";
      clearBtn.hidden = true;
      return;
    }

    if (items.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "리스트가 비어 있어요. 첫 항목을 추가해 보세요!";
      list.append(empty);
    }

    for (const item of items) {
      const li = document.createElement("li");
      if (item.done) li.classList.add("done");

      const check = document.createElement("input");
      check.type = "checkbox";
      check.checked = item.done;
      check.id = "item-" + item.id;
      check.addEventListener("change", () => toggleItem(item.id));

      const label = document.createElement("label");
      label.className = "label";
      label.htmlFor = check.id;
      label.textContent = item.text;

      const del = document.createElement("button");
      del.type = "button";
      del.className = "del";
      del.title = "삭제";
      del.setAttribute("aria-label", item.text + " 삭제");
      del.textContent = "✕";
      del.addEventListener("click", () => deleteItem(item.id));

      li.append(check, label, del);
      list.append(li);
    }

    const doneCount = items.filter(i => i.done).length;
    summary.textContent = items.length
      ? `총 ${items.length}개 중 ${doneCount}개 완료`
      : "";
    clearBtn.hidden = doneCount === 0;
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    // 저장에 성공했을 때만 입력창을 비워서, 실패해도 입력한 내용이 남도록 한다.
    if (await addItem(text)) input.value = "";
    input.focus();
  });

  clearBtn.addEventListener("click", clearDone);

  render();
  (async () => {
    const imported = await importLegacy();
    await load();
    if (!imported) showError("기존 항목을 옮기지 못했어요. 새로고침하면 다시 시도해요.");
  })();
</script>
</body>
</html>
